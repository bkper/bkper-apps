# Live `bookbot` registration. Since the 2026-11-03 cutover, production events go to this Platform app (bookbot.bkper.app).
# Never sync from the retired legacy bkper-agent repository. Deploy, install, or sync only with separate explicit approval.
id: bookbot
name: Bookbot
description: Complete the transactions you type, with the right From and To accounts based on how you recorded similar ones before, and an amount or date from the description.
tags:
  - AI
  - Data entry
  - Bot

logoUrl: https://storage.googleapis.com/bkper-public/logos/agents/bkper-agent-light.svg
logoUrlDark: https://storage.googleapis.com/bkper-public/logos/agents/bkper-agent-dark.svg

website: https://bkper.com/apps/bookbot
ownerName: Bkper
ownerLogoUrl: https://avatars.githubusercontent.com/u/11943086?v=4
ownerWebsite: https://bkper.com
repoUrl: https://github.com/bkper/bkper-apps/tree/main/bookbot
repoPrivate: false
deprecated: false
developers: '*@bkper.com'

webhookUrl: https://bookbot.bkper.app/events
webhookUrlDev: https://bookbot-preview.bkper.app/events

# Bookbot completes typed drafts when created and rediscovers pending drafts after an Account correction.
events:
  - TRANSACTION_CREATED
  - TRANSACTION_POSTED
  - TRANSACTION_UPDATED

propertiesSchema:
  account:
    keys:
      - agent_excluded_properties
  group:
    keys:
      - agent_excluded_properties
  book:
    keys:
      - agent_excluded_properties

apiVersion: v5

deployment:
  server: src/index.ts
  secrets: []
  compatibility_date: '2025-08-23'
