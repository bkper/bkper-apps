# Extractor Bot's permanent app ID. It replaces the retiring `parser-bot` registration (same public name).
# Events stay empty until Bkper has installed it next to `parser-bot` in every Book; the switch then adds
# FILE_CREATED, TRANSACTION_CREATED, TRANSACTION_POSTED, TRANSACTION_UPDATED, TRANSACTION_DELETED and BOOK_AUDITED.
# Sync, deploy, install, or publish only with separate explicit approval.
id: extractor-bot
name: Extractor Bot
description: Extract draft transactions from invoices, receipts, statements, and other documents, and learn from your corrections.

logoUrl: https://raw.githubusercontent.com/bkper/bkper-apps/main/extractor-bot/assets/logo-light.svg
logoUrlDark: https://raw.githubusercontent.com/bkper/bkper-apps/main/extractor-bot/assets/logo-dark.svg

website: https://bkper.com/apps/extractor-bot
ownerName: Bkper
ownerLogoUrl: https://avatars.githubusercontent.com/u/11943086?v=4
ownerWebsite: https://bkper.com
repoUrl: https://github.com/bkper/bkper-apps/tree/main/extractor-bot
repoPrivate: false
deprecated: false
developers: '*@bkper.com'

webhookUrl: https://extractor-bot.bkper.app/events
webhookUrlDev: https://extractor-bot-preview.bkper.app/events

# No events until the switch from `parser-bot` (see the header comment).
events: []

propertiesSchema:
  account:
    keys:
      - agent_parser_transaction
      - agent_parser_transactions
      - agent_parser_file
      - agent_parser_url_transaction
      - agent_parser_url_transactions
      - agent_parser_url_file
      - agent_excluded_properties
  group:
    keys:
      - agent_parser_transaction
      - agent_parser_transactions
      - agent_parser_file
      - agent_parser_url_transaction
      - agent_parser_url_transactions
      - agent_parser_url_file
      - agent_excluded_properties
  book:
    keys:
      - agent_parser_url_transaction
      - agent_parser_url_transactions
      - agent_parser_url_file
      - agent_excluded_properties

filePatterns:
  - '.csv'
  - '.pdf'
  - '.jpg'
  - '.jpeg'
  - '.png'
  - '.bmp'
  - '.webp'

apiVersion: v5

deployment:
  server: src/index.ts
  secrets: []
  compatibility_date: '2025-08-23'
