id: inventory-bot
name: Inventory Bot
description: Track inventory in a dedicated book, sync financial books, and calculate FIFO cost of goods sold.
logoUrl: https://storage.googleapis.com/bkper-public/logos/agents/inventory-agent-light.svg
logoUrlDark: https://storage.googleapis.com/bkper-public/logos/agents/inventory-agent-dark.svg
website: https://bkper.com/apps/inventory-bot
ownerName: Bkper
ownerLogoUrl: https://avatars.githubusercontent.com/u/11943086?v=4
ownerWebsite: https://bkper.com
repoUrl: https://github.com/bkper/bkper-apps/tree/main/inventory-bot
repoPrivate: false
deprecated: false
developers: '*@bkper.com'
menuUrl: https://inventory-bot.bkper.app?bookId=${book.id}&accountId=${account.id}&groupId=${group.id}
menuUrlDev: https://inventory-bot-preview.bkper.app?bookId=${book.id}&accountId=${account.id}&groupId=${group.id}
menuPopupWidth: 600
menuPopupHeight: 600
webhookUrl: https://inventory-bot.bkper.app/events
webhookUrlDev: https://inventory-bot-preview.bkper.app/events
apiVersion: v5
events:
    - TRANSACTION_CHECKED
    - TRANSACTION_UNCHECKED
    - TRANSACTION_POSTED
    - TRANSACTION_DELETED
propertiesSchema:
    book:
        keys:
            - inventory_book
            - exc_code
    transaction:
        keys:
            - good
            - quantity
            - purchase_code
            - purchase_invoice
            - sale_invoice
            - credit_note
            - order
    group:
        keys:
            - exc_code
deployment:
    server: server/src/index.ts
    client: client
    secrets: []
    compatibility_date: '2026-01-28'
