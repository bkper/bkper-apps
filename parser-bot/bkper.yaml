# Retiring registration shell: do not deploy. The app's code lives in ../extractor-bot (app ID `extractor-bot`).
# This folder only lets `bkper app sync` update the live `parser-bot` registration (it must match it exactly:
# sync replaces events, properties, webhooks and the README) and keeps the listing's logo URLs resolving.
# At the switch, set `events: []` here and sync before adding the events to extractor-bot.
# Sync only with separate explicit approval.
id: parser-bot
name: Extractor Bot
description: Extract draft transactions from invoices, receipts, statements, and other documents, and learn from your corrections.

logoUrl: https://raw.githubusercontent.com/bkper/bkper-apps/main/parser-bot/assets/logo-light.svg
logoUrlDark: https://raw.githubusercontent.com/bkper/bkper-apps/main/parser-bot/assets/logo-dark.svg

website: https://bkper.com/apps/parser-bot
ownerName: Bkper
ownerLogoUrl: https://avatars.githubusercontent.com/u/11943086?v=4
ownerWebsite: https://bkper.com
repoUrl: https://github.com/bkper/bkper-apps/tree/main/parser-bot
repoPrivate: false
deprecated: false
developers: '*@bkper.com'

webhookUrl: https://parser-bot.bkper.app/events
webhookUrlDev: https://parser-bot-preview.bkper.app/events

events:
  - FILE_CREATED
  - TRANSACTION_CREATED
  - TRANSACTION_POSTED
  - TRANSACTION_UPDATED
  - TRANSACTION_DELETED
  - BOOK_AUDITED

propertiesSchema:
  account:
    keys:
      - agent_parser_transaction
      - agent_parser_transactions
      - agent_parser_file
      - agent_parser_url_transaction
      - agent_parser_url_transactions
      - agent_parser_url_file
      - agent_excluded_properties
  group:
    keys:
      - agent_parser_transaction
      - agent_parser_transactions
      - agent_parser_file
      - agent_parser_url_transaction
      - agent_parser_url_transactions
      - agent_parser_url_file
      - agent_excluded_properties
  book:
    keys:
      - agent_parser_url_transaction
      - agent_parser_url_transactions
      - agent_parser_url_file
      - agent_excluded_properties

filePatterns:
  - '.csv'
  - '.pdf'
  - '.jpg'
  - '.jpeg'
  - '.png'
  - '.bmp'
  - '.webp'

apiVersion: v5
