# Registered 2026-11-03 (unpublished). Preview deployed and installed only on a dedicated test Book; production not deployed.
# Sync, deploy, install, or publish only with separate explicit approval. Properties and file patterns match the legacy Bookbot until the Phase 4 event migration.
id: parser-bot
name: Parser Bot
description: Extract transaction data from invoices, receipts, statements, and other documents using AI-assisted parsing.

logoUrl: https://raw.githubusercontent.com/bkper/bkper-apps/main/parser-bot/assets/logo-light.svg
logoUrlDark: https://raw.githubusercontent.com/bkper/bkper-apps/main/parser-bot/assets/logo-dark.svg

website: https://bkper.com/apps/parser-bot
ownerName: Bkper
ownerLogoUrl: https://avatars.githubusercontent.com/u/11943086?v=4
ownerWebsite: https://bkper.com
repoUrl: https://github.com/bkper/bkper-apps/tree/main/parser-bot
repoPrivate: false
deprecated: false
developers: '*@bkper.com'

webhookUrl: https://parser-bot.bkper.app/events
webhookUrlDev: https://parser-bot-preview.bkper.app/events

# No events until the Phase 4 handover (P1): the V10 Book migration installs Parser Bot wherever Bookbot is
# installed, and both apps must never process the same events. At the handover, restore:
#   FILE_CREATED, TRANSACTION_CREATED, TRANSACTION_POSTED, TRANSACTION_UPDATED, TRANSACTION_DELETED, BOOK_AUDITED
events: []

propertiesSchema:
  account:
    keys:
      - agent_parser_transaction
      - agent_parser_transactions
      - agent_parser_file
      - agent_parser_url_transaction
      - agent_parser_url_transactions
      - agent_parser_url_file
      - agent_excluded_properties
      - agent_discovery_examples
  group:
    keys:
      - agent_parser_transaction
      - agent_parser_transactions
      - agent_parser_file
      - agent_parser_url_transaction
      - agent_parser_url_transactions
      - agent_parser_url_file
      - agent_excluded_properties
      - agent_discovery_examples
  book:
    keys:
      - agent_parser_url_transaction
      - agent_parser_url_transactions
      - agent_parser_url_file
      - agent_excluded_properties
      - agent_discovery_examples

filePatterns:
  - '.csv'
  - '.pdf'
  - '.jpg'
  - '.jpeg'
  - '.png'
  - '.bmp'
  - '.webp'

apiVersion: v5

deployment:
  server: src/index.ts
  secrets: []
  compatibility_date: '2025-08-23'
