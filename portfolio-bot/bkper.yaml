id: stock-bot
name: Portfolio Bot
description: Track investment portfolios, sync transactions and quantities, and calculate FIFO gains and losses.
logoUrl: https://storage.googleapis.com/bkper-public/logos/agents/portfolio-agent-light.svg
logoUrlDark: https://storage.googleapis.com/bkper-public/logos/agents/portfolio-agent-dark.svg
website: https://bkper.com/apps/stock-bot
ownerName: Bkper
ownerLogoUrl: https://avatars.githubusercontent.com/u/11943086?v=4
ownerWebsite: https://bkper.com
repoUrl: https://github.com/bkper/bkper-apps/tree/main/portfolio-bot
repoPrivate: false
deprecated: false
developers: '*@bkper.com'
users: '*@brain.uy'
menuUrl: https://stock-bot.bkper.app?bookId=${book.id}&accountId=${account.id}&groupId=${group.id}
menuUrlDev: https://stock-bot-preview.bkper.app?bookId=${book.id}&accountId=${account.id}&groupId=${group.id}
menuPopupWidth: 600
menuPopupHeight: 600
webhookUrl: https://stock-bot.bkper.app/events
webhookUrlDev: https://stock-bot-preview.bkper.app/events
apiVersion: v5
events:
    - TRANSACTION_POSTED
    - TRANSACTION_CHECKED
    - TRANSACTION_UNCHECKED
    - TRANSACTION_UPDATED
    - TRANSACTION_DELETED
    - TRANSACTION_RESTORED
    - ACCOUNT_CREATED
    - ACCOUNT_UPDATED
    - ACCOUNT_DELETED
    - GROUP_CREATED
    - GROUP_UPDATED
    - GROUP_DELETED
    - BOOK_UPDATED
propertiesSchema:
    book:
        keys:
            - stock_book
            - stock_historical
            - stock_fair
            - exc_base
            - exc_aggregate
    transaction:
        keys:
            - quantity
            - order
            - interest
            - fees
            - instrument
            - trade_date
            - cost_hist
            - cost_base
            - cost_hist_base
    group:
        keys:
            - stock_exc_code
            - exc_account
    account:
        keys:
            - stock_fees_account
            - exc_account
deployment:
    server: server/src/index.ts
    client: client
    secrets: []
    compatibility_date: '2026-01-28'
