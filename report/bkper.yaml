# Bkper App Configuration
# Full reference: https://raw.githubusercontent.com/bkper/bkper-cli/main/docs/bkper-reference.yaml

id: report
name: Report App
description: Financial reports of your Book, from a request in any language. Read-only, with every number from Bkper.

logoUrl: https://report.bkper.app/images/logo-light.svg
logoUrlDark: https://report.bkper.app/images/logo-dark.svg

website: https://report.bkper.app
ownerName: Bkper
ownerLogoUrl: https://avatars.githubusercontent.com/u/11943086?v=4
ownerWebsite: https://bkper.com
repoUrl: https://github.com/bkper/bkper-apps/tree/main/report
repoPrivate: false
deprecated: false

developers: '*@bkper.com'
users: '*@bkper.com'

menuUrl: https://report.bkper.app/?book=${book.id}&state=${app.state}&bookQuery=${transactions.query}
menuUrlDev: https://report-preview.bkper.app/?book=${book.id}&state=${app.state}&bookQuery=${transactions.query}
menuText: Open Report
menuOpenMode: EXPANDED

deployment:
    server: server/src/index.ts
    client: client
    services:
        - KV
    secrets: []
    compatibility_date: '2026-01-28'
