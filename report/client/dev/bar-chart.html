<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Report: bar chart check</title>
        <!-- Development-only page served by `vite dev` at /dev/bar-chart.html; not part of the build. -->
        <script
            src="https://cdn.jsdelivr.net/npm/@bkper/web-components@0.2.0/dist/theme-init.global.js"
            crossorigin="anonymous"
        ></script>
        <script type="module" src="./bar-chart.ts"></script>
    </head>
    <body>
        <main style="max-width: 720px; margin: 0 auto; padding: var(--bkper-spacing-large)">
            <wa-bar-chart
                label="Sample monthly amounts"
                description="Sample data that checks Web Awesome Pro charts load and render"
            >
                <script type="application/json">
                    {
                        "data": {
                            "labels": ["Jan", "Feb", "Mar", "Apr"],
                            "datasets": [{ "label": "Sample", "data": [42, 58, 63, 71] }]
                        }
                    }
                </script>
            </wa-bar-chart>
        </main>
    </body>
</html>
