id: subledger-bot
name: Subledger Bot
description: Synchronize transactions between parent and child books for ledger-subledger consolidation.
logoUrl: https://storage.googleapis.com/bkper-public/logos/agents/subledger-agent-light.svg
logoUrlDark: https://storage.googleapis.com/bkper-public/logos/agents/subledger-agent-dark.svg
website: https://bkper.com/apps/subledger-bot
ownerName: Bkper
ownerLogoUrl: https://avatars.githubusercontent.com/u/11943086?v=4
ownerWebsite: https://bkper.com
repoUrl: https://github.com/bkper/bkper-apps/tree/main/subledger-bot
repoPrivate: false
deprecated: false
developers: '*@bkper.com'
webhookUrl: https://us-central1-bkper-subledger-bot.cloudfunctions.net/prodGen2
webhookUrlDev: https://subledger-bot-preview.bkper.app/events
apiVersion: v5
events:
    - TRANSACTION_POSTED
    - TRANSACTION_CHECKED
    - TRANSACTION_UPDATED
    - TRANSACTION_DELETED
    - TRANSACTION_RESTORED
    - ACCOUNT_CREATED
    - ACCOUNT_UPDATED
    - ACCOUNT_DELETED
    - GROUP_CREATED
    - GROUP_UPDATED
    - GROUP_DELETED
propertiesSchema:
    book:
        keys:
            - parent_book_id
    group:
        keys:
            - child_book_id
            - parent_account
    account:
        keys:
            - parent_account
    transaction:
        keys:
            - parent_amount
deployment:
    server: server/src/index.ts
    secrets: []
    compatibility_date: '2026-01-28'
